<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Barr Automotive</title>
    
    <!-- Font Awesome Link (Icons ke liye zaroori hai) -->
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        /* Basic Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Business Card / Contact Box Styling */
        .contact-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* Logo Styling */
        .logo-container img {
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
        }

        /* Contact Details Layout */
        .contact-info {
            margin-top: 25px;
            text-align: left;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 16px;
            color: #333;
        }

        /* Icons Common Styling */
        .info-item i {
            font-size: 20px;
            width: 30px;
            text-align: center;
            margin-right: 12px;
        }

        /* Specific Icons Colors */
        .fa-envelope {
            color: #ea4335; /* Gmail Red */
        }

        .fa-whatsapp {
            color: #25d366; /* WhatsApp Green */
        }

        /* Links Styling */
        .info-item a {
            color: #004085;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .info-item a:hover {
            text-decoration: underline;
            color: #002752;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <!-- Logo Section -->
        <div class="logo-container">
            <!-- Jab aap logo file GitHub par upload karein, toh uska jo bhi naam ho (jaise logo.png) woh yahan src="" mein likh dein -->
            <img src="logo.png" alt="Al Barr Automotive Logo">
        </div>

        <!-- Contact Information Section -->
        <div class="contact-info">
            
            <!-- Email Option -->
            <div class="info-item">
                <i class="fa-solid fa-envelope"></i>
                <span><strong>Email:</strong> <a href="mailto:albarrautomotive@gmail.com">albarrautomotive@gmail.com</a></span>
            </div>

            <!-- WhatsApp / Phone Option -->
            <div class="info-item">
                <i class="fa-brands fa-whatsapp"></i>
                <span><strong>WhatsApp:</strong> <a href="https://wa.me" target="_blank">+44 7401 123453</a></span>
            </div>

        </div>
    </div>
    <h1>Albarra Automotive Limited</h1>
    
    <div class="contact-info">
        <h3>Contact Us</h3>
        <p><strong>Phone:</strong> [+44 7401 123453]</p>
        <p><strong>Email:</strong> albarrautomotive@gmail.com</p>
        <p>View our live eBay listings below:</p>
    </div>

</html>
